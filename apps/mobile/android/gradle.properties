org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pinned to AGP 8.13 on purpose: AGP 9's built-in Kotlin breaks the plugin set we
# depend on (file_picker skips KGP on AGP 9+, flutter_plugin_android_lifecycle
# then refuses to apply with built-in Kotlin enabled). Move to AGP 9 only after
# every plugin we use ships AGP 9 support.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 2.3 on this machine fails to close incremental caches for plugin modules
# ("Could not close incremental caches ... class-fq-name-to-source.tab"). Turning
# incremental Kotlin off only slows plugin compilation, so keep it off.
kotlin.incremental=false
